<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#142326">
  <title>Dr. Decision</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="title-screen" aria-labelledby="game-title">
    <div class="orbit orbit-one" aria-hidden="true"></div>
    <div class="orbit orbit-two" aria-hidden="true"></div>
    <div class="title-content">
      <div class="brand-mark" aria-hidden="true">+</div>
      <p class="eyebrow">A game of instinct and consequence</p>
      <h1 id="game-title">Dr. Decision</h1>
      <p class="tagline">Trust your first thought.</p>
      <button class="start-button" id="start-button" type="button">Begin</button>
      <p class="start-hint" id="start-hint">Your next choice starts everything.</p>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
